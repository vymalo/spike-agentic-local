# The mock OpenID issuer of the system's dev stack (another-agentic-system/dev/mock-oidc): approves anybody, users and roles in users.json.
# ISSUER is the in-cluster address (the `iss` of every token); PUBLIC_URL is where the browser reaches it (port-forward 8099).
apiVersion: v1
kind: Service
metadata:
  name: mock-oidc
spec:
  selector:
    app: mock-oidc
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oidc
  template:
    metadata:
      labels:
        app: mock-oidc
    spec:
      containers:
        - name: mock-oidc
          image: another-agentic-system/mock-oidc:dev
          imagePullPolicy: Never
          env:
            - { name: ISSUER, value: "http://mock-oidc:8080" }
            - { name: PUBLIC_URL, value: "http://127.0.0.1:8099" }
            - { name: CLIENT_ID, value: dev-chat }
            - { name: CLIENT_SECRET, value: dev-client-secret }
            - { name: TOKEN_TTL_SECS, value: "3600" }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: users, mountPath: /app/users.json, subPath: users.json, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 3
          resources:
            limits: { memory: 128Mi }
            requests: { cpu: 10m, memory: 32Mi }
      volumes:
        - name: users
          configMap:
            name: mock-oidc-users
